---
name: Inventory Quality

on:
  push:
    branches: ["develop", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: inventory / quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install pinned inventory validator
        run: python3 -m pip install --requirement requirements-ci.txt
      - name: Parse sanitized example inventory
        run: bash scripts/validate-inventory.sh
